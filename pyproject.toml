[project]
name = "edu-rag"
version = "0.1.0"
description = "RAG service that generates cited lessons from source documents"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Yousef Rashad", email = "yousefmrashad@proton.me" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "celery>=5.7.0",
    "fastapi[standard]>=0.162.4",
    "httpx>=0.28.1",
    "openrouter>=1.3.158",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.optional-dependencies]
ingest = [
    "docling>=2.150.0",
    "paddlepaddle>=3.3",
    "tokenizers>=0.21",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "basedpyright>=1.31",
]

# --------------------------------------------------------------------- #
# Lint / format

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E, W), isort (I), pyupgrade (UP), flake8-bugbear (B)
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # Let the formatter handle long lines automatically
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------- #
# Types / tests

[tool.basedpyright]
include = ["src", "tests", "migrations"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
